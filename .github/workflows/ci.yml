name: Tests and build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.workflow == 'Release' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: macos-latest, python: "3.11"}
          - {os: windows-latest, python: "3.11"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install portable dependencies
        run: uv sync --locked --no-default-groups
      - name: Run portable tests (native ChimeraX tests are skipped)
        run: uv run --no-sync python -m unittest discover -s tests -v

  distribution:
    name: Wheel and source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.11"
          enable-cache: false
      - run: uv sync --locked --no-default-groups
      - name: Build wheel from source distribution
        run: uv build
      - name: Verify artifacts and test extracted source distribution
        run: uv run --no-sync python scripts/check_dist.py dist --test-sdist
      - name: Keep validated packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: illustruct-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  documentation:
    name: Zensical documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.11"
          enable-cache: false
      - run: uv sync --locked
      - name: Build documentation without publishing
        run: uv run --no-sync zensical build --clean --strict
      - name: Keep documentation preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: illustruct-docs
          path: site/
          if-no-files-found: error
          retention-days: 14
